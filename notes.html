<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .editor {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .editor input {
            width: 100%;
            padding: 15px;
            border: none;
            border-bottom: 2px solid #e2e8f0;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .editor input:focus {
            outline: none;
            border-bottom-color: #667eea;
        }

        .editor textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .editor textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .notes-list {
            display: grid;
            gap: 15px;
        }

        .note-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .note-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .note-card.active {
            border-left-color: #48bb78;
            background: #f0fff4;
        }

        .note-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .note-preview {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #a0aec0;
        }

        .note-date {
            font-weight: 500;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .note-actions button {
            padding: 5px 12px;
            font-size: 12px;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .empty-state h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #718096;
            font-size: 16px;
        }

        .stats {
            display: flex;
            gap: 10px;
            align-items: center;
            color: #718096;
            font-size: 14px;
        }

        .stat-badge {
            background: #edf2f7;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 15px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .editor {
                padding: 20px;
            }

            .editor textarea {
                min-height: 200px;
            }
        }

        .auto-save {
            color: #48bb78;
            font-size: 13px;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📝 Meeting Notes</h1>
                <div class="stats">
                    <span class="stat-badge"><span id="noteCount">0</span> Notes</span>
                    <span class="auto-save" id="autoSaveStatus"></span>
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="createNewNote()">+ New Note</button>
                <button class="btn-secondary" onclick="exportNotes()">📥 Export</button>
                <button class="btn-danger" onclick="clearAllNotes()">🗑️ Clear All</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search notes..." oninput="filterNotes()">
        </div>

        <div class="editor" id="editor">
            <input type="text" id="noteTitle" placeholder="Note Title" oninput="autoSave()">
            <textarea id="noteContent" placeholder="Start typing your notes here..." oninput="autoSave()"></textarea>
        </div>

        <div class="notes-list" id="notesList"></div>

        <div class="empty-state hidden" id="emptyState">
            <h2>No notes yet</h2>
            <p>Click "New Note" to start taking notes</p>
        </div>
    </div>

    <script>
        let notes = [];
        let currentNoteId = null;
        let autoSaveTimer = null;

        // Load notes from localStorage on page load
        function loadNotes() {
            const savedNotes = localStorage.getItem('meetingNotes');
            if (savedNotes) {
                notes = JSON.parse(savedNotes);
                renderNotes();
                if (notes.length > 0) {
                    loadNote(notes[0].id);
                }
            }
            updateNoteCount();
        }

        // Save notes to localStorage
        function saveNotes() {
            localStorage.setItem('meetingNotes', JSON.stringify(notes));
            showAutoSaveStatus();
            updateNoteCount();
        }

        // Create a new note
        function createNewNote() {
            const newNote = {
                id: Date.now(),
                title: 'Untitled Note',
                content: '',
                created: new Date().toISOString(),
                modified: new Date().toISOString()
            };
            notes.unshift(newNote);
            saveNotes();
            renderNotes();
            loadNote(newNote.id);
        }

        // Load a note into the editor
        function loadNote(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (note) {
                currentNoteId = noteId;
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteContent').value = note.content;
                updateActiveNote();
            }
        }

        // Auto-save the current note
        function autoSave() {
            if (currentNoteId === null) return;

            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.title = document.getElementById('noteTitle').value || 'Untitled Note';
                    note.content = document.getElementById('noteContent').value;
                    note.modified = new Date().toISOString();
                    saveNotes();
                    renderNotes();
                }
            }, 500);
        }

        // Delete a note
        function deleteNote(noteId, event) {
            event.stopPropagation();
            if (confirm('Are you sure you want to delete this note?')) {
                notes = notes.filter(n => n.id !== noteId);
                saveNotes();
                renderNotes();

                if (currentNoteId === noteId) {
                    if (notes.length > 0) {
                        loadNote(notes[0].id);
                    } else {
                        currentNoteId = null;
                        document.getElementById('noteTitle').value = '';
                        document.getElementById('noteContent').value = '';
                    }
                }
            }
        }

        // Render all notes
        function renderNotes() {
            const notesList = document.getElementById('notesList');
            const emptyState = document.getElementById('emptyState');

            if (notes.length === 0) {
                notesList.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            notesList.classList.remove('hidden');
            emptyState.classList.add('hidden');

            notesList.innerHTML = notes.map(note => {
                const preview = note.content.substring(0, 150) || 'No content';
                const date = new Date(note.modified).toLocaleString();
                const isActive = note.id === currentNoteId;

                return `
                    <div class="note-card ${isActive ? 'active' : ''}" onclick="loadNote(${note.id})">
                        <div class="note-title">${escapeHtml(note.title)}</div>
                        <div class="note-preview">${escapeHtml(preview)}</div>
                        <div class="note-meta">
                            <span class="note-date">${date}</span>
                            <div class="note-actions">
                                <button class="btn-danger" onclick="deleteNote(${note.id}, event)">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update active note styling
        function updateActiveNote() {
            renderNotes();
        }

        // Filter notes based on search
        function filterNotes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const noteCards = document.querySelectorAll('.note-card');

            noteCards.forEach(card => {
                const title = card.querySelector('.note-title').textContent.toLowerCase();
                const preview = card.querySelector('.note-preview').textContent.toLowerCase();

                if (title.includes(searchTerm) || preview.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Export notes
        function exportNotes() {
            if (notes.length === 0) {
                alert('No notes to export');
                return;
            }

            const exportData = notes.map(note => {
                return `
==========================================
TITLE: ${note.title}
DATE: ${new Date(note.modified).toLocaleString()}
==========================================

${note.content}

`;
            }).join('\n\n');

            const blob = new Blob([exportData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meeting-notes-${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Clear all notes
        function clearAllNotes() {
            if (confirm('Are you sure you want to delete ALL notes? This cannot be undone.')) {
                notes = [];
                currentNoteId = null;
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                saveNotes();
                renderNotes();
            }
        }

        // Show auto-save status
        function showAutoSaveStatus() {
            const status = document.getElementById('autoSaveStatus');
            status.textContent = '✓ Saved';
            setTimeout(() => {
                status.textContent = '';
            }, 2000);
        }

        // Update note count
        function updateNoteCount() {
            document.getElementById('noteCount').textContent = notes.length;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize the app
        loadNotes();

        // Create first note if none exist
        if (notes.length === 0) {
            createNewNote();
        }
    </script>
</body>
</html>
